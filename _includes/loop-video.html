<figure class="gr-loop{% if include.class %} {{ include.class }}{% endif %}">
  <video muted loop playsinline preload="none" poster="{{ include.poster | relative_url }}" data-src="{{ include.src | relative_url }}" aria-label="{{ include.alt }}"></video>
  {% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
